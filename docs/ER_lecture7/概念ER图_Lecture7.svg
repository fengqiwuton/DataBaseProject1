<text x="655" y="822" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">exit_code</text>
<polyline points="655,827 758.0,827" fill="none" stroke="#476371" stroke-width="1" stroke-dasharray="7 5"/>
<text x="655" y="860" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">{ landmark_name } ← landmark</text>
<text x="767" y="822" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">← exit</text>
<text x="70" y="471" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#233d4a">怎样识别一个出口？</text>
<text x="70" y="518" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">出口编号可跨站重复；同一站内唯一。</text>
<text x="70" y="561" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">完整标识 = 所属车站 ＋ 出口编号。</text>
<text x="70" y="604" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">「拥有」是识别联系，每个出口恰属一站。</text>
<text x="70" y="678" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">「经过」的站序与时刻取决于车站和线路。</text>
<text x="70" y="721" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">尚未编线的站与空线路都允许存在。</text>
<text x="70" y="949" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">¹ 源 CSV 的经纬度表头与数值范围相反，按数值含义映射；坐标可空。</text>
<text x="70" y="990" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">首末班时间可空；出口可以没有地标。</text>
<polyline points="70,1024 1730,1024" fill="none" stroke="#cbd7dc" stroke-width="1"/>
<text x="70" y="1070" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">实线下划线＝主键；虚线下划线＝部分键；双矩形＝弱实体；双菱形＝识别联系。</text>
<text x="70" y="1111" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">箭头指向「一」端；双线＝全参与；实体侧 l..h＝参与次数；{ }＝多值属性。</text>
</svg>