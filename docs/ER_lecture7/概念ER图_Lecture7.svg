<text x="856.75390625" y="829" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233d4a">出口 StationExit</text>
<text x="760" y="883" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">exit_id</text>
<polyline points="760,888 830.0,888" fill="none" stroke="#476371" stroke-width="1"/>
<text x="760" y="921" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">exit_code</text>
<text x="760" y="959" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233d4a">{ landmark_name }</text>
<text x="90" y="543" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#233d4a">业务唯一性（映射后由约束落实）</text>
<text x="90" y="590" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233d4a">District.name_en 唯一</text>
<text x="90" y="632" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233d4a">Station：name_zh + 所属行政区唯一</text>
<text x="90" y="674" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233d4a">MetroLine：中英文名称分别唯一</text>
<text x="90" y="716" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233d4a">StationExit：所属车站 + exit_code 唯一</text>
<text x="90" y="758" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233d4a">经过：车站 + 线路唯一；线路 + position 唯一</text>
<text x="90" y="847" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#617680">出口采用全局 exit_id，因此画普通实体。</text>
<text x="90" y="889" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#617680">地标在当前范围内仅有名称，作为多值属性。</text>
<text x="90" y="931" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#617680">可空值与多值集合允许为空，二者含义不同。</text>
<polyline points="70,1045 1730,1045" fill="none" stroke="#cbd7dc" stroke-width="1"/>
<text x="70" y="1081" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233d4a">图例：下划线=主键；菱形=联系；虚线连接属性框；{ }=多值属性；双线=全参与。</text>
<text x="70" y="1120" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#617680">l..h 标在实体侧，表示该实体参与该联系的次数（Lecture 7 p.35）；0..* 保留新增空线路/未编线站点。</text>
</svg>