<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="metro-token" content="__METRO_TOKEN__">
  <title>深圳地铁数据台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <aside class="sidebar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>深圳地铁<small>轨道交通数据台</small></span>
    </a>
    <nav class="nav" aria-label="功能导航">
      <button type="button" data-view="stations" aria-current="page"><span class="nav-icon icon-stations" aria-hidden="true"></span>站点与出口</button>
      <button type="button" data-view="lines"><span class="nav-icon icon-lines" aria-hidden="true"></span>线路编排</button>
      <button type="button" data-view="routes"><span class="nav-icon icon-routes" aria-hidden="true"></span>路线查询</button>
      <button type="button" data-view="queries"><span class="nav-icon icon-queries" aria-hidden="true"></span>数据核验</button>
      <a id="sql-nav" href="/sql"><span class="nav-icon icon-sql" aria-hidden="true">&gt;_</span>SQL 查询</a>
    </nav>
  </aside>
  <main id="main" tabindex="-1">
    <header class="page-header">
      <div class="page-heading">
        <h1 id="title">站点与出口</h1>
        <p id="subtitle">查找车站，查看所属线路、出口和地标。</p>
      </div>
    </header>
    <dl id="stats" class="stats" aria-label="轨道交通数据概况">
      <div><dt>物理站点</dt><dd id="stat-stations">—</dd></div>
      <div><dt>线路与分期</dt><dd id="stat-lines">—</dd></div>
      <div><dt>独立出口</dt><dd id="stat-exits">—</dd></div>
      <div><dt>出口与地标关联</dt><dd id="stat-landmarks">—</dd></div>
    </dl>
    <div id="notice" role="status" aria-live="polite"></div>
    <section id="workspace" class="workspace" aria-label="查询和管理">
      <div class="panel controls">
        <div class="panel-heading"><h2 id="operation-title">查询条件</h2></div>
        <label>操作<select id="operation" disabled></select></label>
        <form id="operation-form">
          <div id="fields"></div>
          <p class="hint" id="hint"></p>
          <button class="primary" type="submit" disabled>查询站点</button>
        </form>
      </div>
      <section class="panel results" aria-labelledby="result-title">
        <div class="panel-heading">
          <h2 id="result-title">查询结果</h2>
          <button id="reload" class="quiet" type="button" disabled>刷新</button>
        </div>
        <div id="result" aria-live="polite"><p class="empty">正在加载站点数据…</p></div>
      </section>
    </section>
    <section id="sql-workspace" hidden aria-label="SQL 查询工作区">
      <form id="sql-form" class="panel sql-editor">
        <div class="panel-heading">
          <label for="sql-text">PostgreSQL 语句</label>
          <button id="sql-example" class="quiet" type="button">填入示例</button>
        </div>
        <textarea id="sql-text" rows="6" spellcheck="false" aria-describedby="sql-hint">SELECT station_id, name_zh, name_en
FROM project1.station
ORDER BY station_id
LIMIT 10;</textarea>
        <div class="sql-toolbar">
          <p id="sql-hint" class="hint">每次执行一条只读查询，最多显示 200 行。<span class="shortcut"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></span></p>
          <button class="primary" type="submit">执行 SQL</button>
        </div>
      </form>
      <section class="panel results" aria-labelledby="sql-result-title">
        <div class="panel-heading"><h2 id="sql-result-title">查询结果</h2></div>
        <div id="sql-result" aria-live="polite"><p class="empty">执行 SQL 后查看结果。</p></div>
      </section>
    </section>
  </main>
</body>
</html>
